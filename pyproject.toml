[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "email-auth-grader"
version = "1.0.0"
description = "Grade any domain's cold-email readiness from public DNS: SPF lookups, DKIM, DMARC, MTA-STS, BIMI. Exact fix records. CLI, MCP, n8n."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Waseem Nasir", email = "waseemhome8@gmail.com" }]
keywords = ["email-deliverability", "spf", "dkim", "dmarc", "mta-sts", "bimi", "cold-email", "mcp", "n8n"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
  "Environment :: Console",
]
dependencies = ["dnspython>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
email-auth-grader = "grader.cli:main"

[project.urls]
Homepage = "https://www.skynetjoe.com/?utm_source=github&utm_medium=homepage&utm_campaign=email-auth-grader"
Repository = "https://github.com/waseemnasir2k26/email-auth-grader"

[tool.hatch.build.targets.wheel]
packages = ["grader"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "grader/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
