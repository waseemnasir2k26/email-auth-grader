name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Tests (offline, recorded zones only)
        run: pytest -q
      - name: Validate n8n workflow JSON
        run: python scripts/validate_n8n.py
      - name: Smoke test the CLI
        run: |
          email-auth-grader grade perfect.example --zone fixtures/perfect.json --fail-under 90
          email-auth-grader headers tests/eml/good.eml
